<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" role="img" aria-label="UV plane diagram with a circle, center, radius, and sample UV coordinate">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101D34"/><stop offset="1" stop-color="#162B43"/>
    </linearGradient>
    <linearGradient id="circleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EE3CA" stop-opacity=".36"/>
      <stop offset="1" stop-color="#42A6FF" stop-opacity=".19"/>
    </linearGradient>
    <pattern id="minorGrid" x="104" y="56" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#B3D2F2" stroke-opacity=".085" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" x="104" y="56" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#B3D2F2" stroke-opacity=".14" stroke-width="1.3"/>
    </pattern>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#B9CCE2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text {font-family:Inter,Arial,'Noto Sans KR',sans-serif; font-size:17px; fill:#EAF7FF; }
      .axisLabel {font-weight:700; fill:#64E5DF; font-size:23px; }
      .tick {fill:#B5C9E1; font-size:18px; }
      .label {font-weight:600; }
    </style>
  </defs>
  <!-- Only the UV plane, geometry, and coordinate annotations -->
  <rect x="104" y="56" width="400" height="400" fill="url(#panel)" stroke="#6786A6" stroke-width="1.5"/>
  <rect x="104" y="56" width="400" height="400" fill="url(#minorGrid)"/>
  <rect x="104" y="56" width="400" height="400" fill="url(#majorGrid)"/>
  <!-- Circle: c=(0.5,0.5), radius 0.3 -->
  <circle cx="304" cy="256" r="120" fill="url(#circleFill)" stroke="#58E9DC" stroke-width="3.3"/>
  <!-- UV coordinate guides: p=(0.7,0.6) -->
  <path d="M384 216V456 M104 216H384" fill="none" stroke="#FFCA91" stroke-opacity=".75" stroke-width="1.6" stroke-dasharray="5 7"/>
  <!-- radial segment -->
  <path d="M304 256H424" stroke="#C5FFF5" stroke-width="2.6" stroke-dasharray="8 6"/>
  <!-- Center marker -->
  <path d="M290 256H318 M304 242V270" stroke="#F1FFFF" stroke-width="2"/>
  <circle cx="304" cy="256" r="5" fill="#F1FFFF"/>
  <!-- UV sample point and center-to-sample distance -->
  <line x1="304" y1="256" x2="384" y2="216" stroke="#FFC180" stroke-width="2.4"/>
  <circle cx="384" cy="216" r="8.5" fill="#FFD19B" stroke="#936035" stroke-width="1.7"/>
  <circle cx="384" cy="216" r="14.5" fill="none" stroke="#FFD19B" stroke-opacity=".5" stroke-width="1.3"/>
  <!-- Axes -->
  <line x1="104" y1="456" x2="548" y2="456" stroke="#B9CCE2" stroke-width="2" marker-end="url(#axisArrow)"/>
  <line x1="104" y1="456" x2="104" y2="17" stroke="#B9CCE2" stroke-width="2" marker-end="url(#axisArrow)"/>
  <!-- Coordinate info only -->
  <text x="86" y="482" text-anchor="end" class="tick">0</text>
  <text x="504" y="483" text-anchor="middle" class="tick">1</text>
  <text x="85" y="62" text-anchor="end" class="tick">1</text>
  <text x="555" y="464" class="axisLabel">u</text>
  <text x="96" y="21" text-anchor="end" class="axisLabel">v</text>
  <text x="205" y="291" class="label">c = (0.5, 0.5)</text>
  <text x="357" y="279" class="label" fill="#70F0E8">r = 0.3</text>
  <text x="402" y="201" class="label" fill="#FFD09A">p = (u, v)</text>
  <text x="402" y="223" font-size="15" fill="#FFD09A">(0.7, 0.6)</text>
</svg>
